function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);

}

function shade(hex, pct) {
  const h = hex.replace('#', '');

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.volume = BALANCE.baseVolume;
    this.muted = false;
    this.unlocked = false;
  }
  ensure() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.volume;
    this.master.connect(this.ctx.destination);
    this.unlocked = true;
  }
  setVolume(v) {
    this.volume = clamp(v, 0, 1);
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.02);
  }
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.02);
  }
  tone(freq, dur, type='sine', gain=0.16, bend=0) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (bend) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * bend), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.04);
  }
  noise(dur=0.18, gain=0.12, filter=900) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filter;
    const g = this.ctx.createGain();
    const t = this.ctx.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.03);
  }
  play(name) {
    switch (name) {
      case 'click': this.tone(460, 0.055, 'triangle', 0.07, 1.12); break;
      case 'collect': this.tone(740, 0.09, 'sine', 0.10, 1.7); setTimeout(() => this.tone(980, 0.08, 'sine', 0.07, 1.2), 28); break;
      case 'place': this.tone(210, 0.10, 'triangle', 0.11, 0.78); this.noise(0.07, 0.05, 600); break;
      case 'fusion': this.tone(440, 0.16, 'sine', 0.14, 1.8); setTimeout(() => this.tone(880, 0.20, 'triangle', 0.11, 1.35), 70); this.noise(0.22, 0.07, 2100); break;
      case 'shoot': this.tone(520, 0.045, 'square', 0.035, 0.82); break;
      case 'beam': this.tone(900, 0.05, 'sawtooth', 0.030, 1.22); break;
      case 'hit': this.noise(0.045, 0.055, 900); break;
      case 'explosion': this.noise(0.22, 0.18, 520); this.tone(95, 0.16, 'sine', 0.12, 0.55); break;
      case 'death': this.tone(210, 0.12, 'triangle', 0.08, 0.55); this.noise(0.08, 0.04, 700); break;
      case 'warning': this.tone(310, 0.18, 'sawtooth', 0.10, 0.86); setTimeout(() => this.tone(260, 0.18, 'sawtooth', 0.08, 0.86), 170); break;
      case 'victory': [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.20,'triangle',0.12,1.05),i*115)); break;
      case 'defeat': [220,174,130].forEach((f,i)=>setTimeout(()=>this.tone(f,0.28,'sawtooth',0.13,0.8),i*170)); break;
      case 'invalid': this.tone(140, 0.12, 'square', 0.07, 0.7); break;
    }
  }
}

class Board {
  constructor(game) { this.game = game; this.x = 0; this.y = 0; this.cell = 72; this.w = 0; this.h = 0; this.sidePanel = true; }
  layout(w, h) {
    const side = w >= 1180 ? 282 : 0;
    this.sidePanel = side > 0;
    const top = 82, bottom = 128;
    const maxW = Math.max(520, w - side - 118);
    const maxH = Math.max(300, h - top - bottom - 30);
    this.cell = Math.floor(clamp(Math.min(maxW / GRID.cols, maxH / GRID.rows), 54, 96));
    this.w = this.cell * GRID.cols;
    this.h = this.cell * GRID.rows;
    this.x = Math.round((w - side - this.w) * 0.5 + 24);
    this.x = clamp(this.x, 78, Math.max(78, w - side - this.w - 22));
    this.y = Math.round(top + (maxH - this.h) * 0.5);
    this.y = clamp(this.y, 82, Math.max(82, h - bottom - this.h - 12));
  }
  cellCenter(row, col) { return { x:this.x + col * this.cell + this.cell / 2, y:this.y + row * this.cell + this.cell / 2 }; }
  cellRect(row, col) { return { x:this.x + col*this.cell, y:this.y + row*this.cell, w:this.cell, h:this.cell }; }
  cellAt(x, y) {
    const col = Math.floor((x - this.x) / this.cell);
    const row = Math.floor((y - this.y) / this.cell);
    if (row < 0 || row >= GRID.rows || col < 0 || col >= GRID.cols) return null;
    return { row, col };
  }
  laneY(row) { return this.y + row*this.cell + this.cell/2; }
  render(ctx) {
    const g = this.game;
    ctx.save();
    const sky = ctx.createLinearGradient(0, 0, 0, g.h);
    sky.addColorStop(0, '#182642'); sky.addColorStop(0.48, '#11364b'); sky.addColorStop(1, '#0c1729');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, g.w, g.h);

    // background organisms
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 22; i++) {
      const px = (i * 157 + Math.sin(g.time * 0.08 + i) * 18) % (g.w + 80) - 40;
      const py = 80 + ((i * 79) % Math.max(240, g.h - 230));
      ctx.fillStyle = i % 2 ? '#92f4ff' : '#d7ff74';
      ctx.beginPath(); ctx.ellipse(px, py, 2 + (i % 5), 1 + (i % 4), Math.sin(i) * 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // left gate and right rift zones
    const gateX = this.x - this.cell * 0.92;
    const gateY = this.y - 6;
    const gateW = this.cell * 0.74;
    const gateH = this.h + 12;
    const gateGrad = ctx.createLinearGradient(gateX, gateY, gateX + gateW, gateY);
    gateGrad.addColorStop(0, '#253457'); gateGrad.addColorStop(0.5, '#3b6b8a'); gateGrad.addColorStop(1, '#142238');
    ctx.fillStyle = gateGrad;
    fillRoundRect(ctx, gateX, gateY, gateW, gateH, 20);
    ctx.strokeStyle = '#8deaff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.7; strokeRoundRect(ctx, gateX+5, gateY+5, gateW-10, gateH-10, 15); ctx.globalAlpha = 1;
    for (let r = 0; r < GRID.rows; r++) {
      const y = this.laneY(r);
      const active = g.laneSavers[r];
      ctx.fillStyle = active ? '#89f8ff' : '#475264';
      ctx.globalAlpha = active ? 0.9 : 0.35;
      ctx.beginPath(); ctx.moveTo(gateX + gateW*0.48, y - 13); ctx.lineTo(gateX + gateW*0.77, y); ctx.lineTo(gateX + gateW*0.48, y + 13); ctx.lineTo(gateX + gateW*0.20, y); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawCentered(ctx, 'CỔNG', gateX + gateW/2, gateY - 15, 12, '#b5f7ff', 800);

    const riftX = this.x + this.w + 8;
    const rg = ctx.createRadialGradient(riftX + this.cell*0.38, this.y + this.h/2, 4, riftX + this.cell*0.38, this.y + this.h/2, this.h*0.58);
    rg.addColorStop(0, 'rgba(141,91,255,0.45)'); rg.addColorStop(0.55, 'rgba(60,50,120,0.18)'); rg.addColorStop(1, 'rgba(30,20,60,0)');
    ctx.fillStyle = rg; ctx.fillRect(riftX - 20, this.y - 30, this.cell*1.4, this.h + 60);
    ctx.globalAlpha = 0.8;
    for (let r=0; r<GRID.rows; r++) {
      const y = this.laneY(r);
      ctx.strokeStyle = '#a076ff'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(riftX + 22 + Math.sin(g.time*1.8+r)*4, y, 14, this.cell*0.32, Math.sin(g.time+r), 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const bg = ctx.createLinearGradient(this.x, this.y, this.x + this.w, this.y + this.h);
    bg.addColorStop(0, '#1e694e'); bg.addColorStop(0.52, '#287958'); bg.addColorStop(1, '#1b5c52');
    ctx.fillStyle = bg;
    fillRoundRect(ctx, this.x - 8, this.y - 8, this.w + 16, this.h + 16, 22);
    ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.13)'; fillRoundRect(ctx, this.x - 4, this.y - 4, this.w + 8, this.h + 8, 18);
    ctx.shadowColor = 'transparent';

    for (let r = 0; r < GRID.rows; r++) {
      for (let c = 0; c < GRID.cols; c++) {
        const x = this.x + c*this.cell, y = this.y + r*this.cell;
        const alt = (r + c) % 2;
        const cellGrad = ctx.createLinearGradient(x, y, x, y + this.cell);
        cellGrad.addColorStop(0, alt ? '#3a9a65' : '#319060');
        cellGrad.addColorStop(1, alt ? '#28764f' : '#257052');
        ctx.fillStyle = cellGrad;
        ctx.fillRect(x, y, this.cell, this.cell);
        ctx.strokeStyle = 'rgba(190,255,206,0.23)'; ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, this.cell - 1, this.cell - 1);
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#e0ff9d';
        ctx.beginPath();
        ctx.ellipse(x + this.cell*0.22 + ((r*17+c*9)%11), y + this.cell*0.72, 2.5, 1.2, -0.6, 0, TAU);
        ctx.ellipse(x + this.cell*0.64, y + this.cell*0.33 + ((r+c)%5), 2.1, 0.9, 0.4, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // lane stripes
    ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 2;
    for (let r = 1; r < GRID.rows; r++) {
      const y = this.y + r*this.cell;
      ctx.beginPath(); ctx.moveTo(this.x, y); ctx.lineTo(this.x + this.w, y); ctx.stroke();
    }
    ctx.restore();
  }
}

class ParticleSystem {
  constructor(game) {
    this.game = game;
    this.items = [];
    this.pool = [];
  }
  spawn(x, y, opts={}) {
    const p = this.pool.pop() || {};
    p.x = x; p.y = y;
    p.vx = opts.vx ?? rand(-40,40);
    p.vy = opts.vy ?? rand(-40,40);
    p.life = opts.life ?? rand(0.35,0.8);
    p.maxLife = p.life;
    p.size = opts.size ?? rand(2,6);
    p.color = opts.color ?? '#fff';
    p.kind = opts.kind ?? 'dot';
    p.gravity = opts.gravity ?? 0;
    p.spin = opts.spin ?? rand(-4,4);
    p.rot = opts.rot ?? rand(0,TAU);
    p.text = opts.text || '';
    p.alpha = opts.alpha ?? 1;
    this.items.push(p);
    if (this.items.length > BALANCE.maxParticles) this.pool.push(this.items.shift());
  }
  burst(x, y, color, count=12, power=75, opts={}) {
    for (let i=0;i<count;i++) {
      const a = rand(0,TAU), s = rand(power*0.25, power);
      this.spawn(x, y, { color, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.25,0.7), size:rand(2,6), ...opts });
    }
  }
  text(x, y, text, color='#fff', size=15) {
    this.spawn(x, y, { kind:'text', text, color, vx:rand(-8,8), vy:-45, life:0.95, size, gravity:16 });
  }
  update(dt) {
    const arr = this.items;
    for (let i=arr.length-1; i>=0; i--) {
      const p = arr[i];
      p.life -= dt;
      p.vy += p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      if (p.life <= 0) {
        arr.splice(i,1); this.pool.push(p);
      }
    }
  }
  render(ctx) {
    ctx.save();
    for (const p of this.items) {
      const t = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = p.alpha * t;
      if (p.kind === 'text') {
        ctx.font = `800 ${p.size}px system-ui,-apple-system,Segoe UI,Roboto,Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      } else if (p.kind === 'ring') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1-t)*3), 0, TAU); ctx.stroke();
      } else if (p.kind === 'shard') {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.size*0.5, -p.size*0.18, p.size, p.size*0.36);
        ctx.restore();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + t*0.5), 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
}

class ResourceDrop {
  constructor(game, x, y, value, falling=false) {
    this.game = game;
    this.x = x; this.y = falling ? -20 : y;
    this.targetY = y;
    this.value = value;
    this.life = 12;
    this.falling = falling;
    this.phase = rand(0, TAU);
    this.r = value >= 50 ? 18 : 14;
    this.collected = false;
  }
  update(dt) {
    this.life -= dt;
    this.phase += dt * 4;
    if (this.falling) {
      this.y = lerp(this.y, this.targetY, 1 - Math.exp(-dt * 2.2));
      if (Math.abs(this.y - this.targetY) < 2) this.falling = false;
    } else {
      this.y += Math.sin(this.phase) * dt * 2.5;
    }
    return this.life > 0 && !this.collected;
  }
  hit(x, y) { return dist2(x, y, this.x, this.y) <= (this.r + 10) * (this.r + 10); }
  collect() {
    if (this.collected) return;
    this.collected = true;
    this.game.addLumen(this.value, this.x, this.y);
    this.game.audio.play('collect');
    this.game.particles.burst(this.x, this.y, '#ffe86d', 10, 80);
  }
  render(ctx) {
    const pulse = 1 + Math.sin(this.phase) * 0.06;
    ctx.save();
    ctx.globalAlpha = clamp(this.life / 1.2, 0, 1);
    const rg = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, this.r * 2.3);
    rg.addColorStop(0, 'rgba(255,255,196,0.95)');
    rg.addColorStop(0.45, 'rgba(255,218,70,0.78)');
    rg.addColorStop(1, 'rgba(255,218,70,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r*2.2*pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe45d'; ctx.strokeStyle = '#fff5a2'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r*pulse, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff9b9'; ctx.beginPath(); ctx.arc(this.x - this.r*0.28, this.y - this.r*0.32, this.r*0.28, 0, TAU); ctx.fill();
    drawCentered(ctx, this.value, this.x, this.y + 1, this.r > 15 ? 10 : 9, '#6b4e00', 900);
    ctx.restore();
  }
}

class ResourceSystem {
  constructor(game) { this.game = game; this.drops = []; this.timer = BALANCE.envDropInterval * 0.6; }
  reset() { this.drops = []; this.timer = BALANCE.envDropInterval * 0.6; }
  spawn(x, y, value, falling=false) {
    if (this.drops.length >= BALANCE.maxResourceDrops) return;
    this.drops.push(new ResourceDrop(this.game, x, y, value, falling));
  }
  spawnEnvironment() {
    const b = this.game.board;
    const col = randInt(0, GRID.cols - 1), row = randInt(0, GRID.rows - 1);
    const c = b.cellCenter(row, col);
    this.spawn(c.x + rand(-b.cell*0.22, b.cell*0.22), c.y + rand(-b.cell*0.24, b.cell*0.24), BALANCE.envDropValue, true);
  }
  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer += BALANCE.envDropInterval * rand(0.85, 1.15);
      this.spawnEnvironment();
    }
    for (let i=this.drops.length-1; i>=0; i--) {

  fireDouble(target) {

  }

}

class Enemy {
  constructor(game, id, row, x) {
    this.game = game; this.id = id; this.def = ENEMY_DEFS[id]; this.row = row; this.x = x; this.y = game.board.laneY(row);
    this.hp = this.def.hp; this.maxHp = this.def.hp; this.radius = game.board.cell * 0.27 * (this.def.size || 1);
    this.attackTimer = rand(0.1, 0.8); this.dead = false; this.active = true; this.age = 0; this.flash = 0;
    this.slowTimer = 0; this.slowMult = 1; this.freezeTimer = 0; this.bleedTimer = 0; this.bleedDps = 0;
    this.jumpAvailable = !!this.def.jumper; this.jumping = 0; this.summonTimer = this.def.summonInterval ? rand(4, this.def.summonInterval) : 0;
    this.spawnWave = game.waveManager ? game.waveManager.current : 0;
  }
  applySlow(mult, dur) {
    if (!mult || !dur) return;
    if (mult < this.slowMult || this.slowTimer <= 0) this.slowMult = mult;
    this.slowTimer = Math.max(this.slowTimer, dur);
  }
  applyBleed(dps, dur) { if (dps > this.bleedDps) this.bleedDps = dps; this.bleedTimer = Math.max(this.bleedTimer, dur); }
  update(dt) {
    if (!this.active || this.dead) return;
    this.age += dt; this.flash = Math.max(0, this.flash - dt);
    if (this.slowTimer > 0) { this.slowTimer -= dt; if (this.slowTimer <= 0) this.slowMult = 1; }
    if (this.freezeTimer > 0) { this.freezeTimer -= dt; return; }
    if (this.bleedTimer > 0) {
      this.bleedTimer -= dt;
      this.hp -= this.bleedDps * dt;
      if (Math.random() < dt * 5) this.game.particles.spawn(this.x + rand(-8,8), this.y + rand(-10,10), {color:'#90ff7c', size:2.5, life:0.3, vy:-15});
      if (this.bleedTimer <= 0) this.bleedDps = 0;
      if (this.hp <= 0) { this.die(); return; }
    }
    if (this.def.summoner) {
      this.summonTimer -= dt;
      if (this.summonTimer <= 0) {
        this.summonTimer += this.def.summonInterval || 8;
        this.game.spawnEnemy('mite', this.row, this.x + this.game.board.cell*0.45, true);
        this.game.particles.burst(this.x + 12, this.y, '#ff9bd8', 10, 80, {life:0.35});
      }
    }
    if (this.jumping > 0) {
      this.jumping -= dt;
      this.x -= this.getSpeed() * dt * 1.7;
      this.y = this.game.board.laneY(this.row) - Math.sin((1-this.jumping/0.8)*Math.PI) * this.game.board.cell*0.38;
      if (this.jumping <= 0) this.y = this.game.board.laneY(this.row);
      return;
    }
    const contactPlant = this.game.getBlockingPlant(this);
    if (contactPlant && this.jumpAvailable) {
      this.jumpAvailable = false; this.jumping = 0.8;
      this.x -= this.game.board.cell * 0.72;
      this.game.particles.burst(this.x, this.y, '#a4ff80', 10, 90, {life:0.3});
      return;
    }
    if (this.def.ranged) {
      const target = this.game.findPlantForRangedEnemy(this);
      if (target) {
        this.attackTimer -= dt;
        if (this.attackTimer <= 0) {
          this.attackTimer += 1 / (this.def.attackRate || 0.8);
          this.game.enemyProjectiles.push(new EnemyProjectile(this.game, this, target));
          this.game.audio.play('shoot');
          this.game.particles.burst(this.x - 16, this.y - 8, '#caa3ff', 5, 50, {life:0.2});
        }
        return;
      }
    }
    if (contactPlant) {
      this.attackTimer -= dt;
      if (this.attackTimer <= 0) {
        this.attackTimer += 1 / (this.def.attackRate || 0.8);
        const dmg = this.def.damage * (this.def.plantDamageMult || 1);
        contactPlant.takeDamage(dmg, this);
        this.game.particles.burst(contactPlant.x, contactPlant.y, '#ff886b', 4, 40, {life:0.18});
        this.game.audio.play('hit');
      }
      return;
    }
    this.x -= this.getSpeed() * dt;
    this.y = lerp(this.y, this.game.board.laneY(this.row), 0.15);
  }
  getSpeed() {
    let s = this.def.speed * this.slowMult;
    for (const e of this.game.enemies) {
      if (e === this || !e.active || e.dead || !e.def.auraSpeed) continue;
      if (Math.abs(e.row - this.row) <= 1 && dist2(e.x,e.y,this.x,this.y) < (e.def.auraRadius || 160) ** 2) s *= e.def.auraSpeed;
    }
    return s;
  }
  takeDamage(amount, effects={}, projectile=false) {
    if (this.dead || !this.active) return;
    let dmg = amount;
    if (projectile && this.def.projectileResist) dmg *= (1 - this.def.projectileResist);
    if (this.def.armor) dmg = Math.max(1, dmg - this.def.armor);
    this.hp -= dmg;
    this.flash = 0.10;
    if (effects) {
      if (effects.slow) this.applySlow(effects.slow, effects.slowDuration || 2);
      if (effects.bleed) this.applyBleed(effects.bleed, effects.bleedDuration || 3);
      if (effects.freezeChance && Math.random() < effects.freezeChance) { this.freezeTimer = Math.max(this.freezeTimer, 0.65); this.applySlow(0.25, 1.5); }
    }
    if (this.hp <= 0) this.die();
  }
  die() {
    if (this.dead) return;
    this.dead = true; this.active = false;
    this.game.particles.burst(this.x, this.y, this.def.visual.c1, this.def.boss ? 45 : 18, this.def.boss ? 150 : 90, {life:this.def.boss ? 0.9 : 0.5});
    this.game.particles.text(this.x, this.y - 24, '+' + (this.def.value || 3), '#ffe86d', 13);
    if ((this.def.value || 0) >= 12 || Math.random() < 0.16) this.game.addLumen(Math.max(2, Math.floor((this.def.value || 4) * 0.45)), this.x, this.y - 20, true);
    this.game.audio.play('death');
  }
  render(ctx) {
    if (!this.active && !this.dead) return;
    drawEnemyShape(ctx, this);
    // HP
    const hpPct = clamp(this.hp / this.maxHp, 0, 1);
    if (hpPct < 0.98 || this.def.boss) {
      const w = this.radius * (this.def.boss ? 2.2 : 1.8), h = this.def.boss ? 8 : 5;
      const x = this.x - w/2, y = this.y - this.radius - 18;
      ctx.fillStyle = 'rgba(0,0,0,0.42)'; fillRoundRect(ctx, x, y, w, h, h/2);
      ctx.fillStyle = hpPct > 0.35 ? '#ffdc64' : '#ff5757'; fillRoundRect(ctx, x, y, w*hpPct, h, h/2);
    }
    if (this.slowTimer > 0) {
      ctx.save(); ctx.globalAlpha = 0.45; ctx.strokeStyle = '#bdfaff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 7, 0, TAU); ctx.stroke(); ctx.restore();
    }
    if (this.freezeTimer > 0) {
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#dffcff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 4, 0, TAU); ctx.fill(); ctx.restore();
    }
  }
}
function drawEnemyShape(ctx, e) {

  const sh = v.shape;

    ctx.strokeStyle = c2; ctx.lineWidth = 3;
    for (let i=-2;i<=2;i++) { ctx.beginPath(); ctx.moveTo(-r*0.1, i*r*0.22); ctx.lineTo(r*0.8, i*r*0.35 + Math.sin(age*8+i)*3); ctx.stroke(); }
  } else if (sh === 'shell' || sh === 'brute') {

    ctx.strokeStyle = shade(c2,0.1); ctx.lineWidth = 3;
    for (let i=-2;i<=2;i++) { ctx.beginPath(); ctx.moveTo(-r*0.7, i*r*0.18); ctx.quadraticCurveTo(0, -r*0.55+Math.abs(i)*3, r*0.7, i*r*0.18); ctx.stroke(); }
  } else if (sh === 'shard') {
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(-r*0.2, -r*0.9); ctx.lineTo(r*0.95, -r*0.15); ctx.lineTo(r*0.55, r*0.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#dbeaff'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-r*0.2+i*r*0.28,-r*0.5+i*2); ctx.lineTo(i*r*0.24,-r*1.05); ctx.lineTo(r*0.14+i*r*0.22,-r*0.34); ctx.closePath(); ctx.fill(); }
  } else if (sh === 'spitter') {
    ctx.beginPath(); ctx.ellipse(0, 0, r*0.92, r*1.0, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shade(c1,0.18); ctx.beginPath(); ctx.arc(-r*0.72, -r*0.1, r*0.32, 0, TAU); ctx.fill(); ctx.stroke();
  } else if (sh === 'breaker') {
    ctx.beginPath(); ctx.ellipse(0, 0, r*1.05, r*0.85, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8c17b'; ctx.beginPath(); ctx.moveTo(-r*0.95, -r*0.2); ctx.lineTo(-r*1.45, 0); ctx.lineTo(-r*0.95, r*0.2); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (sh === 'herald') {
    ctx.beginPath(); ctx.ellipse(0, 0, r*0.9, r*0.85, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f5e779'; ctx.lineWidth = 2; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-r*0.75, 0, r*(0.5+i*0.25), -0.7, 0.7); ctx.stroke(); }
  } else if (sh === 'brood') {
    ctx.beginPath(); ctx.ellipse(0, 0, r*1.02, r*1.1, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffb4df'; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(Math.cos(i*TAU/5)*r*0.45, Math.sin(i*TAU/5)*r*0.45, r*0.16, 0, TAU); ctx.fill(); }
  } else if (sh === 'boss') {
    ctx.beginPath(); ctx.ellipse(0, 0, r*1.25, r*0.98, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#9c76ff'; for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*r*0.28, -r*0.75); ctx.lineTo(i*r*0.20 + r*0.13, -r*1.25); ctx.lineTo(i*r*0.08 + r*0.28, -r*0.65); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle = '#bdaaff'; ctx.globalAlpha = 0.45; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,r*1.45 + Math.sin(age*3)*4,0,TAU); ctx.stroke(); ctx.globalAlpha=1;

class WaveManager {
  constructor(game) { this.game = game; this.reset(); }
  reset() {
    this.current = -1; this.inWave = false; this.waitTimer = BALANCE.firstWaveDelay; this.waveTime = 0;
    this.spawnList = []; this.spawnIndex = 0; this.total = 0; this.progress = 0; this.done = false;
  }
  buildWave(wave) {
    const list = [];
    for (const g of wave.groups) {
      for (let i=0;i<g.count;i++) {
        list.push({ t:(g.start || 0) + i*(g.interval || 2) + rand(0, g.jitter || 0.55), enemy:g.enemy, lane:g.lane });
      }
    }
    list.sort((a,b)=>a.t-b.t);
    return list;
  }
  startNext() {
    this.current += 1;
    if (this.current >= WAVES.length) { this.game.victory(); return; }
    const wave = WAVES[this.current];
    this.spawnList = this.buildWave(wave); this.spawnIndex = 0; this.total = this.spawnList.length; this.waveTime = 0; this.inWave = true; this.progress = 0;
    this.game.toast(`Wave ${this.current+1}: ${wave.name}`, wave.big ? '#ffdc65' : '#d7fff2', wave.big ? 3.6 : 2.4);
    if (wave.big) { this.game.warningTimer = 2.2; this.game.audio.play('warning'); }
  }
  update(dt) {
    if (this.done) return;
    if (!this.inWave) {
      this.waitTimer -= dt;
      if (this.waitTimer <= 0) this.startNext();
      return;
    }
    this.waveTime += dt;
    while (this.spawnIndex < this.spawnList.length && this.spawnList[this.spawnIndex].t <= this.waveTime) {
      const ev = this.spawnList[this.spawnIndex++];
      let lane;
      if (Array.isArray(ev.lane)) lane = ev.lane[randInt(0, ev.lane.length-1)];
      else if (typeof ev.lane === 'number') lane = ev.lane;
      else lane = randInt(0, GRID.rows-1);
      this.game.spawnEnemy(ev.enemy, lane);
    }
    if (this.total > 0) this.progress = this.spawnIndex / this.total;
    if (this.spawnIndex >= this.spawnList.length && this.game.enemies.length === 0) {
      this.inWave = false; this.progress = 1;
      if (this.current >= WAVES.length - 1) { this.done = true; this.game.victory(); }
      else { this.waitTimer = BALANCE.betweenWaves; this.game.toast(`Wave ${this.current+1} dọn xong`, '#a7ffad', 1.7); }
    }
  }
  getLabel() {
    const waveNum = clamp(this.current + 1, 0, WAVES.length);
    return `${waveNum}/${WAVES.length}`;
  }
}

class FusionSystem {
  constructor(game) { this.game = game; }
  preview(aPlant, bPlant) {
    if (!aPlant || !bPlant || aPlant === bPlant) return {valid:false, reason:'Chọn 2 plant khác nhau'};
    const recipe = getFusionByPair(aPlant.id, bPlant.id);
    if (!recipe) return {valid:false, reason:'Không có recipe fusion'};
    if (this.game.lumen < recipe.cost) return {valid:false, recipe, reason:`Thiếu ${recipe.cost - this.game.lumen} Lumen`};
    return {valid:true, recipe, reason:''};
  }
  fuse(aPlant, bPlant) {
    const p = this.preview(aPlant, bPlant);
    if (!p.valid) { this.game.toast(p.reason, '#ff8b7f', 1.4); this.game.audio.play('invalid'); return false; }
    const recipe = p.recipe;
    const targetRow = bPlant.row, targetCol = bPlant.col;
    const ax = aPlant.x, ay = aPlant.y, bx = bPlant.x, by = bPlant.y;
    this.game.lumen -= recipe.cost;
    this.game.plants[aPlant.row][aPlant.col] = null;
    this.game.plants[bPlant.row][bPlant.col] = null;
    const plant = new Plant(this.game, recipe.result, targetRow, targetCol);
    plant.baseA = recipe.a; plant.baseB = recipe.b;
    this.game.plants[targetRow][targetCol] = plant;
    this.game.selectedCell = {row:targetRow, col:targetCol};
    this.game.fusionMode = false; this.game.fusionFirst = null;
    this.game.particles.burst((ax+bx)/2, (ay+by)/2, recipe.unit.visual.glow || recipe.unit.visual.c1, 42, 170, {life:0.72});
    for (let i=0;i<4;i++) this.game.particles.spawn(plant.x, plant.y, {kind:'ring', color:recipe.unit.visual.glow || recipe.unit.visual.c1, size:20+i*10, life:0.65+i*0.08});
    this.game.screenShake = Math.max(this.game.screenShake, 6);
    this.game.audio.play('fusion');
    this.game.toast(`Fusion thành công: ${recipe.name}`, '#fff18a', 2.3);
    return true;
  }
}

class UI {
  constructor(game) { this.game = game; this.cards = []; this.buttons = {}; this.overlayButton = null; this.sellButton = null; this.fusionButton = null; this.dragVolume = false; }
  handleDown(x, y) {
    const g = this.game;
    if (g.state === 'title') {
      if (contains(this.overlayButton, x, y)) { g.startGame(); g.audio.play('click'); return true; }
      return true;
    }
    if (g.state === 'victory' || g.state === 'defeat') {
      if (contains(this.overlayButton, x, y)) { g.startGame(); g.audio.play('click'); return true; }
      return true;
    }
    if (contains(this.buttons.pause, x, y)) { g.togglePause(); g.audio.play('click'); return true; }
    if (contains(this.buttons.speed, x, y)) { g.speed = g.speed === 1 ? 2 : 1; g.toast(`Tốc độ x${g.speed}`, '#d8f7ff', 1.0); g.audio.play('click'); return true; }
    if (contains(this.buttons.mute, x, y)) { g.audio.toggleMute(); g.audio.play('click'); return true; }
    if (contains(this.buttons.volume, x, y)) { this.dragVolume = true; this.setVolumeFromX(x); g.audio.play('click'); return true; }
    if (contains(this.sellButton, x, y)) { g.sellSelectedPlant(); return true; }
    if (contains(this.fusionButton, x, y)) { g.startFusionFromSelection(); return true; }
    for (const card of this.cards) {
      if (contains(card.rect, x, y)) { g.selectCard(card.id); g.audio.play('click'); return true; }
    }
    return false;
  }
  handleMove(x, y) { if (this.dragVolume) this.setVolumeFromX(x); }
  handleUp() { this.dragVolume = false; }
  setVolumeFromX(x) {
    const r = this.buttons.volume;
    if (!r) return;
    this.game.audio.setVolume(clamp((x - r.x) / r.w, 0, 1));
  }
  render(ctx) {
    const g = this.game;
    this.cards = []; this.buttons = {}; this.overlayButton = null; this.sellButton = null; this.fusionButton = null;
    this.renderTop(ctx);
    this.renderCards(ctx);
    if (g.board.sidePanel) this.renderSidePanel(ctx); else this.renderCompactInfo(ctx);
    if (g.state === 'title') this.renderTitle(ctx);
    if (g.paused && g.state === 'playing') this.renderPause(ctx);
    if (g.state === 'victory' || g.state === 'defeat') this.renderEnd(ctx);
    this.renderTooltip(ctx);
  }
  renderTop(ctx) {
    const g = this.game;
    ctx.save();
    const grad = ctx.createLinearGradient(0,0,0,72); grad.addColorStop(0,'rgba(12,22,38,0.96)'); grad.addColorStop(1,'rgba(18,42,55,0.78)');

    for (let i=this.laneSaverFx.length-1;i>=0;i--) {
      const fx = this.laneSaverFx[i]; fx.life -= dt; const t = clamp(fx.life / fx.maxLife,0,1);
      const y = this.board.laneY(fx.row), x0 = this.board.x - this.board.cell*0.72, x1 = this.board.x + this.board.w + this.board.cell*0.7;
      ctx.globalAlpha = t;
      ctx.strokeStyle = '#9ffaff'; ctx.lineWidth = 14 * t; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * t; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(lerp(x0,x1,1-t*0.35),y); ctx.stroke();
      if (fx.life <= 0) this.laneSaverFx.splice(i,1);
    }
    ctx.restore();
  }
  renderMessages(ctx) {
    ctx.save();
    for (let i=0;i<this.messages.length;i++) {
      const m = this.messages[i], t=clamp(m.life/m.maxLife,0,1);
      ctx.globalAlpha = clamp(t*1.4,0,1);
      drawCentered(ctx, m.text, this.w/2, 92 + i*26 - (1-t)*16, 18, m.color, 900);
    }
    ctx.restore();
  }
  renderWarning(ctx) {
    if (this.warningTimer <= 0) return;
    ctx.save();
    const a = Math.sin(this.warningTimer*10) > 0 ? 0.55 : 0.25;
    ctx.globalAlpha = a; ctx.fillStyle = '#ff6e56'; ctx.fillRect(0,74,this.w,4); ctx.fillRect(0,this.h-136,this.w,4);
    ctx.globalAlpha = 1; drawCentered(ctx,'ĐỢT LỚN ĐANG ĐẾN',this.w/2,128,24,'#ffec8a',1000);
    ctx.restore();
  }
  spawnEnemy(id, row, x=null, summoned=false) {
    const spawnX = x ?? (this.board.x + this.board.w + this.board.cell * rand(0.65, 1.15));
    const e = new Enemy(this, id, clamp(row,0,GRID.rows-1), spawnX);
    if (summoned) e.hp *= 0.72, e.maxHp = e.hp;
    this.enemies.push(e);
    return e;
  }
  addLumen(amount, x, y, tiny=false) {
    this.lumen += Math.max(0, Math.floor(amount));
    this.particles.text(x, y, '+' + Math.floor(amount), tiny ? '#fff2a3' : '#ffe86d', tiny ? 12 : 15);
  }
  damageEnemy(enemy, amount, effects, source, projectile=false) {
    if (!enemy || enemy.dead) return;
    const wasAlive = enemy.hp > 0;
    enemy.takeDamage(amount, effects, projectile);
    if (wasAlive && enemy.dead) this.stats.kills++;
  }
  damageEnemiesInRadius(x, y, radius, amount, effects, source) {
    const r2 = radius*radius;
    for (const e of this.enemies) {
      if (!e.active || e.dead) continue;
      const d2 = dist2(x,y,e.x,e.y);
      if (d2 <= r2) {
        const falloff = 0.65 + 0.35 * (1 - Math.sqrt(d2)/radius);
        this.damageEnemy(e, amount * falloff, effects, source, false);
      }
    }
  }
  findTargetInLane(row, plantX, rangeCols) {
    const maxX = plantX + rangeCols * this.board.cell;
    let best = null;
    for (const e of this.enemies) {
      if (!e.active || e.dead || e.row !== row) continue;
      if (e.x >= plantX - 10 && e.x <= maxX) if (!best || e.x < best.x) best = e;
    }
    return best;
  }
  getBlockingPlant(enemy) {
    const row = this.plants[enemy.row];
    for (let c=GRID.cols-1;c>=0;c--) {
      const p = row[c]; if (!p || p.dead) continue;
      const pc = this.board.cellCenter(enemy.row, c);
      if (enemy.x <= pc.x + this.board.cell*0.43 && enemy.x >= pc.x - this.board.cell*0.48) return p;
    }
    return null;
  }
  findPlantForRangedEnemy(enemy) {
    let best = null, bestD = Infinity;
    const maxD = (enemy.def.range || 2.5) * this.board.cell;
    for (let c=GRID.cols-1;c>=0;c--) {
      const p = this.plants[enemy.row][c]; if (!p || p.dead) continue;
      const d = enemy.x - p.x;
      if (d > 0 && d < maxD && d < bestD) { best = p; bestD = d; }
    }
    return best;
  }
  getAttackRateMultiplier(plant) {
    let mult = 1;
    for (let r=0;r<GRID.rows;r++) for (let c=0;c<GRID.cols;c++) {
      const p = this.plants[r][c]; if (!p || p === plant || !p.def.auraAttack) continue;
      const dx = Math.abs(c - plant.col), dy = Math.abs(r - plant.row);
      const range = p.def.auraRadius || 1.2;
      if (Math.sqrt(dx*dx + dy*dy) <= range) mult += p.def.auraAttack;
    }
    return clamp(mult, 0.6, 2.2);
  }
  checkLaneBreaches() {
    for (const e of this.enemies) {
      if (!e.active || e.dead) continue;
      if (e.x < this.board.x - this.board.cell*0.55) {
        if (this.laneSavers[e.row]) {
          this.activateLaneSaver(e.row);
          break;
        } else {
          this.defeat();
          break;
        }
      }
    }
  }
  activateLaneSaver(row) {
    this.laneSavers[row] = false;
    this.laneSaverFx.push({row, life:0.7, maxLife:0.7});
    for (const e of this.enemies) if (e.row === row) this.damageEnemy(e, BALANCE.laneSaverDamage, {}, null, false);
    this.particles.burst(this.board.x, this.board.laneY(row), '#9ffaff', 34, 180, {life:0.55});
    this.screenShake = Math.max(this.screenShake, 8);
    this.toast(`Lăng Kính Cứu Nguy lane ${row+1} đã kích hoạt`, '#9ffaff', 2.2);
    this.audio.play('explosion');
  }
  victory() { if (this.state !== 'playing') return; this.state = 'victory'; this.audio.play('victory'); this.toast('Victory!', '#aaff9b', 3); }
  defeat() { if (this.state !== 'playing') return; this.state = 'defeat'; this.audio.play('defeat'); this.toast('Defeat', '#ff8d82', 3); }
  toast(text, color='#fff', life=1.6) { this.messages.unshift({text, color, life, maxLife:life}); if (this.messages.length > 5) this.messages.pop(); }
  getSelectedPlant() { return this.selectedCell ? this.plants[this.selectedCell.row]?.[this.selectedCell.col] : null; }
  selectCard(id) {
    if (this.state !== 'playing') return;
    this.selectedCard = id; this.selectedCell = null; this.fusionMode = false; this.fusionFirst = null;
  }
  tryPlacePlant(id, row, col) {
    const def = PLANT_DEFS[id];
    if (!def) return false;
    if (this.plants[row][col]) { this.toast('Ô đã có plant', '#ffb4a5', 1.1); this.audio.play('invalid'); return false; }
    if (this.lumen < def.cost) { this.toast('Không đủ Lumen', '#ffb4a5', 1.1); this.audio.play('invalid'); return false; }
    if ((this.cardCooldowns[id] || 0) > 0) { this.toast('Plant đang hồi', '#ffb4a5', 1.1); this.audio.play('invalid'); return false; }
    this.lumen -= def.cost; this.cardCooldowns[id] = def.cooldown;
    const p = new Plant(this, id, row, col); this.plants[row][col] = p;
    this.selectedCell = {row,col};
    this.particles.burst(p.x, p.y, def.visual.c1, 14, 65, {life:0.36}); this.audio.play('place');
    return true;
  }
  sellSelectedPlant() {
    const p = this.getSelectedPlant(); if (!p) return;
    const baseCost = PLANT_DEFS[p.id]?.cost || 140;
    const refund = Math.floor(baseCost * BALANCE.plantRefundRate + (p.def.visual.fusion ? 35 : 0));
    this.addLumen(refund, p.x, p.y - 20);
    this.plants[p.row][p.col] = null; this.selectedCell = null; this.audio.play('collect'); this.particles.burst(p.x,p.y,'#ffe86d',14,70,{life:0.35});
  }
  startFusionFromSelection() {
    const p = this.getSelectedPlant();
    if (!p) return;
    this.fusionMode = true; this.fusionFirst = p; this.selectedCard = null;
    this.toast(`Chọn plant thứ hai để fusion với ${p.def.short}`, '#fff2a3', 1.6); this.audio.play('click');
  }
  togglePause() { if (this.state === 'playing') this.paused = !this.paused; }
  screenToCanvas(e) {
    const rect = this.canvas.getBoundingClientRect(); return {x:e.clientX - rect.left, y:e.clientY - rect.top};
  }
  onPointerDown(e) {
    const m = this.screenToCanvas(e); this.mouse.x=m.x; this.mouse.y=m.y; this.mouse.down=true; this.audio.ensure();
    if (this.ui.handleDown(m.x,m.y)) return;
    if (this.state !== 'playing' || this.paused) return;
    if (this.resourceSystem.collectAt(m.x, m.y)) return;
    const cell = this.board.cellAt(m.x,m.y);
    if (!cell) { this.selectedCell = null; this.selectedCard = null; this.fusionMode=false; this.fusionFirst=null; return; }
    const plant = this.plants[cell.row][cell.col];
    if (this.fusionMode && this.fusionFirst && plant && plant !== this.fusionFirst) {
      if (this.fusionSystem.fuse(this.fusionFirst, plant)) this.stats.fusions++;
      return;
    }
    if (plant) {
      this.selectedCell = cell; this.selectedCard = null; this.dragSource = plant; this.dragStart = {x:m.x,y:m.y}; this.draggingPlant = false;
      if (this.fusionMode && !this.fusionFirst) this.fusionFirst = plant;
      return;
    }
    if (this.selectedCard) this.tryPlacePlant(this.selectedCard, cell.row, cell.col);
  }
  onPointerMove(e) {
    const m = this.screenToCanvas(e); this.mouse.x=m.x; this.mouse.y=m.y; this.ui.handleMove(m.x,m.y);
    this.hoverCard = null;
    for (const card of this.ui.cards) if (contains(card.rect, m.x, m.y)) this.hoverCard = card.id;
    this.dragHoverPlant = null;
    if (this.dragSource && this.dragStart) {
      if (dist2(m.x,m.y,this.dragStart.x,this.dragStart.y) > 64) this.draggingPlant = true;
      if (this.draggingPlant) {
        const cell = this.board.cellAt(m.x,m.y);
        if (cell) {
          const p = this.plants[cell.row][cell.col];
          if (p && p !== this.dragSource) this.dragHoverPlant = p;
        }
      }
    }
  }
  onPointerUp(e) {
    const m = this.screenToCanvas(e); this.mouse.x=m.x; this.mouse.y=m.y; this.mouse.down=false; this.ui.handleUp();
    if (this.state !== 'playing') { this.dragSource=null; return; }
    if (this.dragSource && this.draggingPlant) {
      const cell = this.board.cellAt(m.x,m.y);
      const target = cell ? this.plants[cell.row][cell.col] : null;
      if (target && target !== this.dragSource) {
        if (this.fusionSystem.fuse(this.dragSource, target)) this.stats.fusions++;
      } else { this.toast('Thả lên plant tương thích để fusion', '#ffb4a5', 1.1); this.audio.play('invalid'); }
    }
    this.dragSource=null; this.dragHoverPlant=null; this.draggingPlant=false; this.dragStart=null;
  }
  onKeyDown(e) {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); this.togglePause(); this.audio.play('click'); }
    if (e.key === 'r' || e.key === 'R') { if (this.state !== 'title') this.startGame(); }
    if (e.key === 'Escape') { this.selectedCard=null; this.selectedCell=null; this.fusionMode=false; this.fusionFirst=null; }
    if (e.key === 'f' || e.key === 'F') {
      if (this.state === 'playing') {
        if (this.getSelectedPlant()) this.startFusionFromSelection();
        else { this.fusionMode = !this.fusionMode; this.fusionFirst = null; this.toast(this.fusionMode?'Chọn plant đầu tiên để fusion':'Đã tắt fusion', '#fff2a3', 1.2); }
      }
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9 && CARD_IDS[n-1]) this.selectCard(CARD_IDS[n-1]);
  }
}

const game = new Game(document.getElementById('game'));
window.__LUMENROOT_GAME__ = game;
})();
