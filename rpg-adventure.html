<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hành Trình Vương Quốc 3D</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #101827; color: #fff; }
    canvas { display: block; } #hud { position: fixed; inset: 0; pointer-events: none; padding: 18px; text-shadow: 0 2px 3px #000; }
    #title { color: #fde68a; font-size: clamp(20px, 4vw, 30px); font-weight: bold; } #stats, #quest, #message { background: rgba(10,18,30,.76); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 10px 13px; }
    #stats { margin-top: 10px; width: min(260px, 72vw); } #quest { position: absolute; right: 18px; top: 18px; max-width: 330px; color: #fef3c7; } #message { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); min-width: min(420px, 85vw); text-align: center; opacity: 0; transition: opacity .2s; }
    .bar { height: 10px; background: #4b1f27; border-radius: 8px; overflow: hidden; margin: 6px 0; } .bar > i { display: block; height: 100%; width: 100%; background: #ef4444; } #xp > i { background: #60a5fa; }
    #help { position: absolute; bottom: 18px; left: 18px; color: #dbeafe; font-size: 13px; } #back { pointer-events: auto; position:absolute; right:18px; bottom:18px; color:white; background:#b45309; text-decoration:none; padding:10px 13px; border-radius:8px; font-weight:bold; }
    #cover { position:fixed; inset:0; display:grid; place-items:center; background:#111827; z-index:2; text-align:center; padding:20px; } #cover button { margin-top:16px; border:0; padding:12px 20px; border-radius:8px; color:#fff; font-weight:bold; background:#d97706; cursor:pointer; }
  </style>
</head>
<body>
  <div id="cover"><div><h1>⚔ Hành Trình Vương Quốc 3D</h1><p>Đánh bại slime để giải cứu ngôi làng.</p><button id="start">Bắt đầu chơi</button></div></div>
  <div id="hud"><div id="title">⚔ Hành Trình Vương Quốc 3D</div><div id="stats">Hiệp sĩ cấp <b id="level">1</b><div class="bar"><i id="hp"></i></div><small id="hpText"></small><div class="bar" id="xp"><i></i></div><small id="xpText"></small></div><div id="quest">Nhiệm vụ: Tới gần Trưởng làng và nhấn E.</div><div id="message"></div><div id="help">Di chuyển: WASD / mũi tên · Đánh: Space · Tương tác: E</div><a id="back" href="index.html">← Trang chủ</a></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x82b7df); scene.fog=new THREE.Fog(0x82b7df,28,85);
    const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,150), renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xdbeafe,0x24452b,2.4)); const sun=new THREE.DirectionalLight(0xfff1c1,2.8); sun.position.set(18,28,12);sun.castShadow=true;scene.add(sun);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x3d7c4b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground); const grid=new THREE.GridHelper(100,40,0x548b5a,0x548b5a);grid.position.y=.015;scene.add(grid);
    const keys=new Set(), clock=new THREE.Clock(); let started=false,quest=0,slain=0,attackT=0,messageT=0,over=false;
    const player={group:new THREE.Group(),hp:100,maxHp:100,xp:0,level:1}; player.group.position.set(-12,0,-10);scene.add(player.group);
    function shadow(m){m.castShadow=true;m.receiveShadow=true;return m} function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75})}
    const body=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.6,.72,1.5,12),mat(0x2563eb)));body.position.y=1.2;player.group.add(body);const head=shadow(new THREE.Mesh(new THREE.SphereGeometry(.52,16,12),mat(0xf1c6a8)));head.position.y=2.25;player.group.add(head);const sword=shadow(new THREE.Mesh(new THREE.BoxGeometry(.13,.13,1.35),mat(0xe5e7eb)));sword.position.set(.75,1.2,.3);sword.rotation.x=Math.PI/2;player.group.add(sword);
    function tree(x,z){const g=new THREE.Group(),trunk=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,8),mat(0x70442a))),crown=shadow(new THREE.Mesh(new THREE.ConeGeometry(1.35,3.5,10),mat(0x185a35)));trunk.position.y=1;crown.position.y=3;g.add(trunk,crown);g.position.set(x,0,z);scene.add(g)} [[-22,-20],[-5,-24],[8,-23],[22,-19],[-23,18],[-14,22],[3,24],[18,20],[25,5],[-25,2],[5,8]].forEach(p=>tree(...p));
    const hut=new THREE.Mesh(new THREE.BoxGeometry(7,3,5),mat(0xc49a63));hut.position.set(-14,1.5,-18);hut.castShadow=true;scene.add(hut);const roof=shadow(new THREE.Mesh(new THREE.ConeGeometry(5,2.8,4),mat(0x9a4e24)));roof.position.set(-14,4.35,-18);roof.rotation.y=Math.PI/4;scene.add(roof);
    const elder=new THREE.Group();elder.position.set(-9,0,-12);const eb=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.55,.65,1.5,10),mat(0x7c3f20))),eh=shadow(new THREE.Mesh(new THREE.SphereGeometry(.48,14,10),mat(0xf2c7a5)));eb.position.y=1.15;eh.position.y=2.2;elder.add(eb,eh);scene.add(elder);
    const enemies=[];function slime(x,z){const g=new THREE.Group(),s=shadow(new THREE.Mesh(new THREE.SphereGeometry(.85,18,12,0,Math.PI*2,0,Math.PI/2),mat(0x69d56d)));s.position.y=.08;g.add(s);[-.27,.27].forEach(a=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),mat(0x172033));e.position.set(a,.52,.7);g.add(e)});g.position.set(x,0,z);scene.add(g);enemies.push({g,hp:35,flash:0});} [[3,-8],[12,-4],[18,9],[2,17],[-5,10],[20,-15]].forEach(p=>slime(...p));
    const hpEl=document.querySelector('#hp'),xpEl=document.querySelector('#xp i'),hpText=document.querySelector('#hpText'),xpText=document.querySelector('#xpText'),levelEl=document.querySelector('#level'),questEl=document.querySelector('#quest'),messageEl=document.querySelector('#message');
    function note(t,s=2.8){messageEl.textContent=t;messageEl.style.opacity=1;messageT=s}function updateHud(){hpEl.style.width=(player.hp/player.maxHp*100)+'%';xpEl.style.width=(player.xp/(player.level*60)*100)+'%';hpText.textContent='HP '+Math.ceil(player.hp)+' / '+player.maxHp;xpText.textContent='XP '+player.xp+' / '+(player.level*60);levelEl.textContent=player.level;questEl.textContent=quest===0?'Nhiệm vụ: Tới gần Trưởng làng và nhấn E.':quest===1?'Nhiệm vụ: Hạ slime ('+Math.min(slain,3)+'/3).':'Nhiệm vụ hoàn thành! Bạn đã bảo vệ ngôi làng.'}
    function interact(){if(player.group.position.distanceTo(elder.position)>4)return;if(quest===0){quest=1;note('Trưởng làng: Hãy đánh bại 3 slime!')}else if(quest===1&&slain>=3){quest=2;note('Trưởng làng: Cảm ơn người hùng!',4)}else if(quest===1)note('Còn '+(3-slain)+' slime nữa.');updateHud()}
    function attack(){if(attackT>0||over)return;attackT=.35;sword.rotation.z=-1.3;let hit=false;enemies.slice().forEach(e=>{if(player.group.position.distanceTo(e.g.position)<3.3){e.hp-=20+player.level*4;e.flash=.18;hit=true;if(e.hp<=0){scene.remove(e.g);enemies.splice(enemies.indexOf(e),1);slain++;player.xp+=30;if(player.xp>=player.level*60){player.xp-=player.level*60;player.level++;player.maxHp+=20;player.hp=player.maxHp;note('Lên cấp '+player.level+'!')}note('Slime bị đánh bại! '+slain+'/3')}});if(hit)updateHud()}
    addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' ','e'].includes(k))e.preventDefault();keys.add(k);if(k==='e'&&!e.repeat)interact();if(k===' '&&!e.repeat)attack()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
    function loop(){requestAnimationFrame(loop);if(!started)return;const dt=Math.min(clock.getDelta(),.05);if(messageT>0&&(messageT-=dt)<=0)messageEl.style.opacity=0;if(attackT>0){attackT-=dt;if(attackT<=0)sword.rotation.z=0}if(!over){let x=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),z=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(x||z){const l=Math.hypot(x,z);x/=l;z/=l;player.group.position.x=THREE.MathUtils.clamp(player.group.position.x+x*8*dt,-27,27);player.group.position.z=THREE.MathUtils.clamp(player.group.position.z+z*8*dt,-27,27);player.group.rotation.y=Math.atan2(x,z)}enemies.forEach(e=>{const d=e.g.position.distanceTo(player.group.position);if(d<15&&d>1.5)e.g.position.addScaledVector(player.group.position.clone().sub(e.g.position).normalize(),2*dt);if(d<1.65)player.hp-=10*dt;e.g.children[0].material.color.setHex(e.flash>0?0xfca5a5:0x69d56d);e.flash-=dt});if(player.hp<=0){player.hp=0;over=true;note('Bạn đã gục ngã. Tải lại trang để chơi lại.',5)}updateHud()}const target=player.group.position.clone().add(new THREE.Vector3(0,15,18));camera.position.lerp(target,.08);camera.lookAt(player.group.position.x,0,player.group.position.z);renderer.render(scene,camera)}
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#start').onclick=()=>{document.querySelector('#cover').style.display='none';started=true;clock.start();note('Hãy tới gặp Trưởng làng!',3);updateHud()};updateHud();loop();
  </script>
</body>
</html>
